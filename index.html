<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Lumina — Illuminate Your Mind</title>

  <!-- ICON -->
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />

  <!-- ===== PWA META TAGS ===== -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="msapplication-TileColor" content="#6366f1" />

  <!-- iOS Safari Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lumina" />
  <meta name="application-name" content="Lumina" />

  <!-- Open Graph -->
  <meta property="og:title" content="Lumina — Illuminate Your Mind" />
  <meta property="og:description" content="Platform belajar interaktif dengan AI Coach, gamifikasi misi, treasure hunt, dan asesmen." />
  <meta property="og:image" content="./og-image.png" />

  <style>
    :root {
      --lumina-indigo: #6366f1;
      --lumina-violet: #8b5cf6;
      --lumina-light: #a78bfa;
      --lumina-bg: #0f111a;
      --lumina-bg-card: rgba(26, 30, 46, 0.8);
      --lumina-text: #f3f4f6;
      --lumina-text-gray: #9ca3af;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--lumina-bg);
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    /* Iframe container — full screen, no gap */
    .iframe-container {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      /* Padding untuk safe area iPhone X+ */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      box-sizing: border-box;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background-color: var(--lumina-bg); /* match app bg */
    }

    /* ===== SPLASH SCREEN — Lumina horizontal logo ===== */
    #lumina-splash {
      position: fixed;
      inset: 0;
      background: var(--lumina-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10000;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      overflow: hidden;
    }

    /* Aurora gradient bg di splash */
    #lumina-splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 25% 15%, rgba(99, 102, 241, 0.18), transparent 60%),
        radial-gradient(ellipse 70% 50% at 75% 85%, rgba(139, 92, 246, 0.12), transparent 60%);
      animation: auroraDrift 15s ease-in-out infinite alternate;
    }
    @keyframes auroraDrift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(3%, -3%) scale(1.08); }
    }

    #lumina-splash.hide {
      opacity: 0;
      visibility: hidden;
    }

    /* Horizontal logo wrapper */
    .splash-logo-wrap {
      position: relative;
      z-index: 1;
      max-width: 320px;
      width: 80vw;
      animation: logoFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .splash-logo-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      animation: logoGlow 2.5s ease-in-out infinite alternate 1s;
    }
    @keyframes logoFadeIn {
      0%   { opacity: 0; transform: scale(0.85) translateY(20px); }
      60%  { opacity: 1; transform: scale(1.02) translateY(0); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes logoGlow {
      from { filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4)); }
      to   { filter: drop-shadow(0 0 35px rgba(139, 92, 246, 0.7)); }
    }

    /* Tagline EN */
    .splash-tagline {
      position: relative;
      z-index: 1;
      color: rgba(196, 181, 253, 0.95);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 3px;
      margin: 0;
      text-transform: uppercase;
      animation: titleFade 0.8s ease 0.7s both;
    }

    /* Tagline ID */
    .splash-tagline-id {
      position: relative;
      z-index: 1;
      color: rgba(167, 139, 250, 0.75);
      font-size: 0.72rem;
      font-style: italic;
      letter-spacing: 1px;
      margin: 0;
      animation: titleFade 0.8s ease 0.9s both;
    }

    @keyframes titleFade {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Loading bar */
    .splash-loader {
      position: relative;
      z-index: 1;
      width: 120px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }
    .splash-loader::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--lumina-indigo), var(--lumina-violet), transparent);
      border-radius: 99px;
      animation: loaderSlide 1.5s ease-in-out infinite;
    }
    @keyframes loaderSlide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* ===== INSTALL BUTTON — minimal, top-right ===== */
    #btn-install {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      right: 12px;
      z-index: 9999;
      background: linear-gradient(135deg, var(--lumina-indigo), var(--lumina-violet));
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    #btn-install:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(99, 102, 241, 0.55);
    }
    #btn-install:active { transform: scale(0.95); }
    #btn-install svg { width: 16px; height: 16px; }

    /* ===== OFFLINE BANNER ===== */
    #offline-banner {
      position: fixed;
      top: env(safe-area-inset-top);
      left: 0;
      right: 0;
      z-index: 10001;
      background: linear-gradient(135deg, #ef4444, #f87171);
      color: white;
      padding: 8px 16px;
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }
    #offline-banner.show { transform: translateY(0); }
  </style>
</head>
<body>

  <!-- Splash Screen — pakai horizontal logo (orb + LUMINA wordmark) -->
  <div id="lumina-splash">
    <div class="splash-logo-wrap">
      <img src="./lumina-logo-full.jpg" alt="Lumina — Illuminate Your Mind" class="splash-logo-img" />
    </div>
    <p class="splash-tagline">Illuminate Your Mind</p>
    <p class="splash-tagline-id">Cahaya Pengetahuan</p>
    <div class="splash-loader"></div>
  </div>

  <!-- Offline Banner -->
  <div id="offline-banner">📡 Anda sedang offline — beberapa fitur mungkin terbatas</div>

  <!-- Install Button -->
  <button id="btn-install" aria-label="Install Lumina">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2zM12 2l5.5 5.5-1.41 1.41L13 5.83V16h-2V5.83L7.91 8.91 6.5 7.5 12 2z"/></svg>
    Install Lumina
  </button>

  <!-- Iframe — Apps Script app -->
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbymtZIxJfEt1oLN2-OBWwy8OiRmn7-2iHzcPTJyhEkFaPMjOX-mFA9PZqBs9Zls7AcEIA/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation; clipboard-read; clipboard-write;">
    </iframe>
  </div>

  <script>
    // ===== Hide splash saat iframe load =====
    (function() {
      var iframe = document.getElementById('app');
      var splash = document.getElementById('lumina-splash');
      var hidden = false;
      function hideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('hide');
        setTimeout(function() { if (splash.parentElement) splash.remove(); }, 700);
      }
      iframe.addEventListener('load', hideSplash);
      // Fallback: hide splash setelah 6 detik
      setTimeout(hideSplash, 6000);
    })();

    // ===== Service Worker =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('[Lumina PWA] SW registered:', reg.scope);
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  setTimeout(function() { window.location.reload(); }, 500);
                }
              });
            });
            window.addEventListener('focus', function() { reg.update(); });
          })
          .catch(function(err) { console.warn('[Lumina PWA] SW failed:', err); });
      });
    }

    // ===== Install Prompt =====
    var deferredPrompt = null;
    var btnInstall = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'flex';
      console.log('[Lumina PWA] Install ready');
    });

    btnInstall.addEventListener('click', function() {
      if (!deferredPrompt) {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        if (isIOS) {
          alert('💡 Pasang Lumina di iPhone:\n\n1. Tap Share (⎋)\n2. Add to Home Screen\n3. Tap Add');
        } else {
          alert('💡 Pasang Lumina:\n\n1. Tap menu ⋮\n2. Pilih "Install app"\n3. Tap Install');
        }
        return;
      }
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choice) {
        deferredPrompt = null;
        btnInstall.style.display = 'none';
      });
    });

    window.addEventListener('appinstalled', function() {
      btnInstall.style.display = 'none';
    });

    // ===== Offline indicator =====
    var offlineBanner = document.getElementById('offline-banner');
    window.addEventListener('online', function() { offlineBanner.classList.remove('show'); });
    window.addEventListener('offline', function() { offlineBanner.classList.add('show'); });
    if (!navigator.onLine) { offlineBanner.classList.add('show'); }
  </script>
</body>
</html>
