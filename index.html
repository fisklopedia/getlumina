<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Lumina — Illuminate Your Mind</title>

  <!-- ICON -->
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />

  <!-- ===== PWA META TAGS ===== -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="msapplication-TileColor" content="#6366f1" />

  <!-- iOS Safari Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lumina" />
  <meta name="application-name" content="Lumina" />

  <!-- Open Graph -->
  <meta property="og:title" content="Lumina — Illuminate Your Mind" />
  <meta property="og:description" content="Platform belajar interaktif dengan AI Coach, gamifikasi misi, treasure hunt, dan asesmen." />
  <meta property="og:image" content="./og-image.png" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0d14;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    .iframe-container {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      box-sizing: border-box;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Tombol Install PWA — pojok kanan atas, kecil, tidak mengganggu */
    #btn-install {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      right: 12px;
      z-index: 9999;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      cursor: pointer;
      display: none; /* default hidden, only show when installable */
      align-items: center;
      gap: 6px;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    #btn-install:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.55);
    }
    #btn-install:active { transform: scale(0.95); }
    #btn-install svg { width: 16px; height: 16px; }

    /* Splash screen minimal — cepat hilang */
    #lumina-splash {
      position: fixed;
      inset: 0;
      background: #0b0d14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      overflow: hidden;
    }
    #lumina-splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(99, 102, 241, 0.12), transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(139, 92, 246, 0.10), transparent 60%);
    }
    #lumina-splash.hide {
      opacity: 0;
      visibility: hidden;
    }
    .splash-orb {
      position: relative;
      width: 100px;
      height: 100px;
      z-index: 1;
      animation: orbPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .splash-orb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.6));
      animation: orbGlow 2s ease-in-out infinite alternate 0.9s;
    }
    @keyframes orbPop {
      0%   { opacity: 0; transform: scale(0.4); }
      60%  { opacity: 1; transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes orbGlow {
      from { filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.6)); }
      to   { filter: drop-shadow(0 0 45px rgba(139, 92, 246, 0.9)); }
    }
    .splash-title {
      position: relative;
      z-index: 1;
      color: white;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 6px;
      margin: 0;
      background: linear-gradient(90deg, #c4b5fd, #a78bfa, #c4b5fd);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShine 3s linear infinite, titleFade 0.8s ease 0.3s both;
    }
    @keyframes titleShine { to { background-position: 200% center; } }
    @keyframes titleFade {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .splash-tagline {
      position: relative;
      z-index: 1;
      color: rgba(167, 139, 250, 0.8);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 3px;
      margin: 0;
      text-transform: uppercase;
      animation: titleFade 0.8s ease 0.7s both;
    }
    .splash-spinner {
      position: relative;
      z-index: 1;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-top: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Splash Screen minimal -->
  <div id="lumina-splash">
    <div class="splash-orb"><img src="./icon-512.png" alt="Lumina" /></div>
    <h1 class="splash-title">LUMINA</h1>
    <p class="splash-tagline">Illuminate Your Mind</p>
    <div class="splash-spinner"></div>
  </div>

  <!-- Tombol Install PWA — muncul hanya saat installable -->
  <button id="btn-install" aria-label="Install Lumina">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2zM12 2l5.5 5.5-1.41 1.41L13 5.83V16h-2V5.83L7.91 8.91 6.5 7.5 12 2z"/></svg>
    Install Lumina
  </button>

  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbymtZIxJfEt1oLN2-OBWwy8OiRmn7-2iHzcPTJyhEkFaPMjOX-mFA9PZqBs9Zls7AcEIA/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation; clipboard-read; clipboard-write;">
    </iframe>
  </div>

  <script>
    // ===== Hide splash saat iframe load =====
    (function() {
      var iframe = document.getElementById('app');
      var splash = document.getElementById('lumina-splash');
      var hidden = false;
      function hideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('hide');
        setTimeout(function() { if (splash.parentElement) splash.remove(); }, 600);
      }
      iframe.addEventListener('load', hideSplash);
      setTimeout(hideSplash, 5000); // fallback max 5 detik
    })();

    // ===== PWA: Register Service Worker =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('[Lumina PWA] SW registered:', reg.scope);
            // Cek update SW
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[Lumina PWA] New version — reloading...');
                  setTimeout(function() { window.location.reload(); }, 500);
                }
              });
            });
            // Update SW saat app kembali ke foreground
            window.addEventListener('focus', function() { reg.update(); });
          })
          .catch(function(err) { console.warn('[Lumina PWA] SW failed:', err); });
      });
    }

    // ===== PWA: Install Prompt =====
    var deferredPrompt = null;
    var btnInstall = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'flex';
      console.log('[Lumina PWA] Install prompt ready');
    });

    btnInstall.addEventListener('click', function() {
      if (!deferredPrompt) {
        // Fallback: alert instruksi manual
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        if (isIOS) {
          alert('💡 Pasang Lumina di iPhone/iPad:\n\n1. Tap tombol Share (⎋)\n2. Pilih "Add to Home Screen"\n3. Tap "Add"');
        } else {
          alert('💡 Pasang Lumina di Android:\n\n1. Tap menu ⋮ (pojok kanan atas Chrome)\n2. Pilih "Install app" atau "Add to Home screen"\n3. Tap "Install"');
        }
        return;
      }
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choice) {
        if (choice.outcome === 'accepted') {
          console.log('[Lumina PWA] User installed');
        }
        deferredPrompt = null;
        btnInstall.style.display = 'none';
      });
    });

    window.addEventListener('appinstalled', function() {
      console.log('[Lumina PWA] App installed');
      btnInstall.style.display = 'none';
    });
  </script>
</body>
</html>
