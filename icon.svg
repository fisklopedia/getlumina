<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgIcon" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#231552"/>
      <stop offset="55%" stop-color="#1E1147"/>
      <stop offset="100%" stop-color="#150D38"/>
    </radialGradient>
    <radialGradient id="vignetteIcon" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="haloIcon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8A6E8" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#B8A6E8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#B8A6E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbIcon" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FDFBF4"/>
      <stop offset="35%" stop-color="#F0EAF5"/>
      <stop offset="70%" stop-color="#C9BCE8"/>
      <stop offset="100%" stop-color="#9A87C9"/>
    </radialGradient>
    <filter id="softGlowIcon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgIcon)"/>
  <circle cx="256" cy="256" r="300" fill="url(#haloIcon)" filter="url(#softGlowIcon)"/>
  <circle cx="256" cy="256" r="150" fill="url(#orbIcon)"/>
  <circle cx="256" cy="256" r="150" fill="none"
          stroke="#7C68A8" stroke-opacity="0.25" stroke-width="3"/>
  <rect width="512" height="512" fill="url(#vignetteIcon)"/>
</svg>
