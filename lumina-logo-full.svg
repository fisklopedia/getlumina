<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344 768" width="1344" height="768">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#2A1A5E"/>
      <stop offset="50%" stop-color="#1E1147"/>
      <stop offset="100%" stop-color="#120A2E"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4B1F0" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#B8A6E8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#B8A6E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="36%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#F4EDF8"/>
      <stop offset="40%" stop-color="#D8CCEC"/>
      <stop offset="75%" stop-color="#B6A4DC"/>
      <stop offset="100%" stop-color="#9A87C9"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1344" height="768" fill="url(#bg)"/>

  <!-- Halo (soft glow around orb) -->
  <circle cx="175" cy="405" r="160" fill="url(#halo)" filter="url(#softGlow)"/>

  <!-- Main orb -->
  <circle cx="175" cy="405" r="80" fill="url(#orb)"/>

  <!-- Subtle rim -->
  <circle cx="175" cy="405" r="80" fill="none"
          stroke="#7C68A8" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Vignette -->
  <rect width="1344" height="768" fill="url(#vignette)"/>

