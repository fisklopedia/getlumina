<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#2A1A5E"/>
      <stop offset="50%" stop-color="#1E1147"/>
      <stop offset="100%" stop-color="#0F0A26"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4B1F0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#B8A6E8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#B8A6E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="36%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#F4EDF8"/>
      <stop offset="40%" stop-color="#D8CCEC"/>
      <stop offset="75%" stop-color="#B6A4DC"/>
      <stop offset="100%" stop-color="#9A87C9"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle aurora gradient overlay for depth -->
  <ellipse cx="300" cy="200" rx="500" ry="200" fill="#6366f1" opacity="0.06"/>
  <ellipse cx="950" cy="500" rx="450" ry="180" fill="#8b5cf6" opacity="0.05"/>

  <!-- Halo around orb -->
  <circle cx="186" cy="290" r="140" fill="url(#halo)" filter="url(#softGlow)"/>

  <!-- Main orb -->
  <circle cx="186" cy="290" r="70" fill="url(#orb)"/>

  <!-- Subtle rim -->
  <circle cx="186" cy="290" r="70" fill="none"
          stroke="#7C68A8" stroke-opacity="0.22" stroke-width="2"/>

